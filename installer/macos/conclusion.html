<h2>MOLES is installed</h2>
<p>Open <b>MOLES</b> from your Applications folder (or search for it with Spotlight).
It opens the launcher, from which every MOLES app starts.</p>
<p>To uninstall, drag MOLES from Applications to the Bin. Your settings and data in
the <code>.moles</code> folder of your home folder are left in place.</p>
